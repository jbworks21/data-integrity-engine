[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-integrity-engine"
version = "0.1.0"
description = "A pure-Python data integrity and audit suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # List any third-party dependencies here (leave empty if pure standard library)
    "cryptography>=40.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_integrity*"]
